<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주 탐사 퀴즈</title>
<style>
:root{
  --bg:#f3f5fb;--card:#fff;--text:#1b2033;--muted:#6a7189;--border:#dde1ee;
  --accent:#5b5bf0;--on-accent:#fff;--accent-soft:#ecebff;--ok:#1fa35c;--ok-bg:#dcf6e7;--bad:#e03e4e;--bad-bg:#fde3e6;
  --shadow:0 10px 30px rgba(40,50,100,.12);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0e1c;--card:#151a30;--text:#e8eaf6;--muted:#9aa1c0;--border:#2a3154;
    --accent:#8c8cff;--on-accent:#0b0e1c;--accent-soft:#232a52;--ok:#3ddc84;--ok-bg:#123a28;--bad:#ff6b7a;--bad-bg:#431a24;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;
  background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,var(--accent),transparent),
    radial-gradient(1px 1px at 28% 72%,var(--accent),transparent),
    radial-gradient(1.5px 1.5px at 44% 34%,var(--accent),transparent),
    radial-gradient(1px 1px at 63% 83%,var(--accent),transparent),
    radial-gradient(2px 2px at 78% 22%,var(--accent),transparent),
    radial-gradient(1px 1px at 90% 58%,var(--accent),transparent),
    radial-gradient(1.5px 1.5px at 7% 90%,var(--accent),transparent),
    radial-gradient(1px 1px at 55% 8%,var(--accent),transparent);
  animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.25}to{opacity:.7}}
main{width:100%;max-width:440px}
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.confetti i{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.res.great .big{background:linear-gradient(90deg,#f0b429,#f06b9a,#8c8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
h1{font-size:20px;margin:0 0 16px;text-align:center}
.card{position:relative;border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:var(--shadow);
  background:
    linear-gradient(color-mix(in srgb,var(--accent) 7%,transparent) 1px,transparent 1px) 0 0/100% 24px,
    linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,transparent) 1px,transparent 1px) 0 0/24px 100%,
    var(--card)}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--accent);pointer-events:none}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.top{display:flex;justify-content:space-between;align-items:center;font:600 12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.top #count::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--ok);
  box-shadow:0 0 8px var(--ok);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.35}}
.timer{font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.urgent{color:var(--bad)}
.score b{color:var(--accent);font-size:15px;font-variant-numeric:tabular-nums}
.bar{position:relative;height:10px;background:var(--accent-soft);border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5b5bf0,#c15bf0,#f06b9a);transition:width .5s ease}
.bar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),var(--card) calc(10% - 2px) 10%)}
.q{font-size:16px;font-weight:600;margin:0 0 16px}
.opts{display:grid;gap:10px}
button.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;transition:transform .12s,border-color .12s,background .2s}
button.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
button.opt:focus-visible,.next:focus-visible,.copy-button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;
  box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}
button.opt:focus-visible{background:var(--accent-soft)}
button.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-bg);border-color:var(--ok);animation:pop .45s}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);animation:shake .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04);box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 30%,transparent)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fb{min-height:44px;margin-top:14px;font-size:14px;color:var(--muted)}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.next{margin-top:6px;font:inherit;font-weight:600;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);cursor:pointer;display:none}
.next.show{display:block;animation:pop .3s}
.copy-button{margin-top:6px;font:inherit;font-weight:600;width:100%;padding:12px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);color:var(--text);cursor:pointer}
.copy-button:hover{border-color:var(--accent);background:var(--card)}
.copy-status{min-height:1.5em;margin:4px 0 8px;color:var(--muted);font-size:14px}
.copy-status.success{color:var(--ok)}.copy-status.error{color:var(--bad)}
.res{text-align:center;display:none}
.emoji{font-size:64px;animation:bounce 1s infinite alternate}
@keyframes bounce{to{transform:translateY(-8px) rotate(6deg)}}
.big{font-size:34px;font-weight:700;margin:4px 0}
.res p{color:var(--muted);margin:4px 0 18px}
.review{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);text-align:left}
.review h3{margin:0;font-size:16px}
.review-list{max-height:300px;overflow-y:auto;overscroll-behavior:contain;margin:10px 0 0;padding-left:28px}
.review-list li+li{margin-top:10px}
.review-list h4{margin:0 0 6px;font-size:14px}
.review-list p{margin:4px 0;color:var(--text);font-size:14px}
.review-list .wrong-answer{color:var(--bad)}
.review-list .correct-answer{color:var(--ok)}
.review-list .explanation{color:var(--muted)}
.record{color:var(--accent)!important;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>🚀 우주 탐사 퀴즈</h1>
  <div class="card">
    <section id="quiz">
      <div class="top"><span id="count">문제 1 / 10</span><span class="timer" id="timer" role="timer" aria-label="남은 시간" aria-live="off"></span><span class="score">점수: <b id="score">0</b></span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="barwrap"><i id="bar"></i></div>
      <p class="q" id="q"></p>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb" aria-live="polite"></div>
      <button class="next" id="next"></button>
    </section>
    <section class="res" id="res">
      <div class="result-summary" aria-live="polite" aria-atomic="true">
        <div class="emoji" id="emoji"></div>
        <div class="big" id="final"></div>
        <h2 id="title" style="font-size:18px;margin:0"></h2>
        <p id="msg"></p>
        <p class="record" id="best"></p>
        <p class="record" id="new-record" hidden>🎉 새 기록!</p>
      </div>
      <button class="copy-button" id="copy-score" type="button">점수 복사</button>
      <div class="copy-status" id="copy-status" aria-live="polite" aria-atomic="true"></div>
      <section class="review" id="review" aria-labelledby="review-title" hidden>
        <h3 id="review-title">틀린 문제 복습</h3>
        <ol class="review-list" id="review-list" aria-labelledby="review-title" tabindex="0"></ol>
      </section>
      <button class="next show" id="again">다시 하기</button>
    </section>
  </div>
</main>
<script>
const Q=[
["인류 최초로 우주에 간 사람은?",["닐 암스트롱","유리 가가린","앨런 셰퍼드","존 글렌"],1,"유리 가가린은 1961년 4월 12일 지구 궤도를 돌았습니다."],
["인류를 처음 달에 착륙시킨 임무는?",["아폴로 8호","아폴로 11호","아폴로 13호","제미니 4호"],1,"아폴로 11호는 1969년 7월에 착륙했습니다."],
["‘붉은 행성’으로 불리는 행성은?",["금성","목성","화성","수성"],2,"산화철 먼지가 화성을 붉게 만듭니다."],
["최초의 인공위성은?",["익스플로러 1호","보스토크 1호","스푸트니크 1호","텔스타"],2,"스푸트니크 1호는 1957년에 발사되었습니다."],
["1990년에 발사된 우주 망원경은?",["허블","케플러","웹","스피처"],0,"허블은 30년 넘게 관측하고 있습니다."],
["최초로 성간 공간에 진입한 탐사선은?",["파이어니어 10호","보이저 1호","카시니","뉴호라이즌스"],1,"보이저 1호는 2012년에 진입했습니다."],
["퍼서비어런스 로버를 운용하는 기관은?",["ESA","JAXA","NASA","로스코스모스"],2,"2021년 예제로 크레이터에 착륙했습니다."],
["토성에서 가장 큰 위성은?",["타이탄","유로파","엔셀라두스","이오"],0,"타이탄에는 두꺼운 대기와 메탄 호수가 있습니다."],
["최초의 여성 우주비행사는?",["샐리 라이드","발렌티나 테레시코바","메이 제미슨","페기 휘트슨"],1,"테레시코바는 1963년 보스토크 6호로 비행했습니다."],
["명왕성을 최초로 근접 통과한 탐사선은?",["보이저 2호","돈","주노","뉴호라이즌스"],3,"뉴호라이즌스는 2015년에 명왕성을 통과했습니다."]
];
const $=id=>document.getElementById(id);
let i=0,score=0,locked=false,quizQuestions=[],wrongAnswers=[];
const TIME_LIMIT=15;
let timerInterval=null,timeRemaining=TIME_LIMIT;
const BEST_SCORE_KEY="spaceQuizBestScore";
let bestScore=0;
try{
  const saved=window.localStorage.getItem(BEST_SCORE_KEY);
  const parsed=Number(saved);
  if(saved!==null&&Number.isInteger(parsed)&&parsed>=0&&parsed<=Q.length)bestScore=parsed;
}catch{}
function shuffle(items){
  for(let n=items.length-1;n>0;n--){
    const k=Math.floor(Math.random()*(n+1));
    [items[n],items[k]]=[items[k],items[n]];
  }
  return items;
}
function prepareQuiz(){
  quizQuestions=Q.map(([question,options,correctIndex,explanation])=>{
    const shuffledOptions=shuffle(options.map((text,index)=>({text,index})));
    return [question,shuffledOptions.map(option=>option.text),
      shuffledOptions.findIndex(option=>option.index===correctIndex),explanation];
  });
  shuffle(quizQuestions);
}
function show(){
  stopTimer();
  locked=false;const [q,o]=quizQuestions[i];
  $("count").textContent=`문제 ${i+1} / ${quizQuestions.length}`;
  $("q").textContent=q;$("fb").textContent="";$("fb").className="fb";
  $("next").classList.remove("show");
  $("opts").innerHTML="";
  o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(k,b);$("opts").appendChild(b)});
  startTimer();
}
function setBar(n){$("bar").style.width=n/quizQuestions.length*100+"%";$("barwrap").setAttribute("aria-valuenow",n)}
function stopTimer(){if(timerInterval!==null){clearInterval(timerInterval);timerInterval=null}}
function updateTimer(){
  $("timer").textContent=`남은 시간: ${timeRemaining}초`;
  $("timer").classList.toggle("urgent",timeRemaining<=5);
}
function startTimer(){
  timeRemaining=TIME_LIMIT;updateTimer();
  timerInterval=setInterval(()=>{
    timeRemaining--;updateTimer();
    if(timeRemaining<=0){stopTimer();pick(null,null,true)}
  },1000);
}
function pick(k,btn,timedOut=false){
  if(locked)return;locked=true;
  stopTimer();
  const [,,a,why]=quizQuestions[i];const bs=[...$("opts").children];
  bs.forEach(b=>b.disabled=true);
  if(timedOut){wrongAnswers.push({number:i+1,question:quizQuestions[i][0],selected:"시간 초과",correct:quizQuestions[i][1][a],explanation:why});bs[a].classList.add("correct");$("fb").className="fb bad";$("fb").textContent=`⏰ 시간 초과! 정답은 ${quizQuestions[i][1][a]}입니다. ${why}`;}
  else if(k===a){score++;btn.classList.add("correct");$("fb").className="fb ok";$("fb").textContent="✅ 정답! "+why;}
  else{wrongAnswers.push({number:i+1,question:quizQuestions[i][0],selected:quizQuestions[i][1][k],correct:quizQuestions[i][1][a],explanation:why});btn.classList.add("wrong");bs[a].classList.add("correct");$("fb").className="fb bad";$("fb").textContent="❌ 아쉬워요. "+why;}
  $("score").textContent=score;setBar(i+1);
  $("next").textContent=i===quizQuestions.length-1?"결과 보기":"다음 문제";
  $("next").classList.add("show");$("next").focus();
}
$("next").onclick=()=>{i++;i<quizQuestions.length?show():finish()};
function finish(){
  $("quiz").style.display="none";$("res").style.display="block";
  const list=$("review-list");
  list.innerHTML="";
  $("review").hidden=wrongAnswers.length===0;
  wrongAnswers.forEach(({number,question,selected,correct,explanation})=>{
    const item=document.createElement("li");
    const heading=document.createElement("h4");heading.textContent=`문제 ${number}. ${question}`;
    item.appendChild(heading);
    [["내가 고른 답",selected,"wrong-answer"],["정답",correct,"correct-answer"],["해설",explanation,"explanation"]].forEach(([label,value,className])=>{
      const line=document.createElement("p");
      line.className=className;
      const strong=document.createElement("strong");strong.textContent=label+": ";
      line.append(strong,document.createTextNode(value));
      item.appendChild(line);
    });
    list.appendChild(item);
  });
  const r=[[10,"🏆","임무 사령관!","완벽해요. 휴스턴이 자랑스러워합니다."],[8,"🚀","우주비행사 감","발사 준비 완료!"],[5,"🌍","궤도 안착 중","탄탄해요, 더 탐험해 보세요."],[0,"🛰️","아직 훈련 중","계속 탐험하고 다시 도전해 보세요."]].find(x=>score>=x[0]);
  $("res").classList.toggle("great",score>=8);
  if(score>=8)celebrate();
  $("emoji").textContent=r[1];$("final").textContent=`${score} / ${quizQuestions.length}`;$("title").textContent=r[2];$("msg").textContent=r[3];
  const isNewRecord=score>bestScore;
  if(isNewRecord){
    bestScore=score;
    try{window.localStorage.setItem(BEST_SCORE_KEY,String(bestScore))}catch{}
  }
  $("best").textContent=`최고 점수: ${bestScore} / ${quizQuestions.length}`;
  $("new-record").hidden=!isNewRecord;
  $("again").focus();
}
async function copyScore(){
  const status=$("copy-status");
  try{
    if(!navigator.clipboard||typeof navigator.clipboard.writeText!=="function"){
      status.className="copy-status error";
      status.textContent="이 브라우저에서는 클립보드 복사를 지원하지 않아요.";
      return;
    }
    await navigator.clipboard.writeText(`우주 탐사 퀴즈 ${score} / ${quizQuestions.length}점!`);
    status.className="copy-status success";
    status.textContent="복사했어요!";
  }catch{
    status.className="copy-status error";
    status.textContent="복사하지 못했어요. 브라우저의 클립보드 권한을 확인해 주세요.";
  }
}
function celebrate(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.createElement("div");c.className="confetti";c.setAttribute("aria-hidden","true");
  const cols=["#f0b429","#f06b9a","#8c8cff","#3ddc84","#4dc3ff"];
  for(let n=0;n<40;n++){const p=document.createElement("i");
    p.style.cssText=`left:${Math.random()*100}%;background:${cols[n%5]};animation-duration:${2.5+Math.random()*2}s;animation-delay:${Math.random()*.8}s`;
    c.appendChild(p)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),6000);
}
document.addEventListener("keydown",e=>{
  const n=+e.key;if(n>=1&&n<=4&&$("quiz").style.display!=="none"){const b=$("opts").children[n-1];if(b&&!b.disabled)b.click()}
});
function restart(){
  stopTimer();
  i=0;score=0;wrongAnswers=[];$("review").hidden=true;$("review-list").innerHTML="";
  $("copy-status").className="copy-status";$("copy-status").textContent="";
  $("score").textContent=0;setBar(0);
  $("res").style.display="none";$("quiz").style.display="block";
  prepareQuiz();show();
}
$("again").onclick=restart;
$("copy-score").onclick=copyScore;
prepareQuiz();
show();
</script>
</body>
</html>
